name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-citrus
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 跑离线测试
        run: npm test

      - name: 语法检查
        run: |
          for file in lib/index.js lib/client.js lib/config.js lib/tools.js lib/prompt.js lib/runtime.js lib/render.js lib/store.js lib/core/*.js lib/platforms/zhihu/*.js bin/cli.mjs; do
            node --check "$file"
          done

  package:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 构建 tarball
        run: node scripts/build.mjs

      - name: 检查产物
        run: |
          ls -l dist/
          tar -tzf dist/dsh-citrus-*.tgz | head -20